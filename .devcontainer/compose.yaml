# Docker Compose reference guide: https://docs.docker.com/go/compose-spec-reference/
services:
  mdbook-utils:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile  # path relative to context
      args:
        RUST_IMAGE_LABEL: ${RUST_IMAGE_LABEL}
        RUSTFMT_TOOLCHAIN: ${RUSTFMT_TOOLCHAIN:-}
        MDBOOK_VERSION: ${MDBOOK_VERSION}
        SCCACHE_VERSION: ${SCCACHE_VERSION:?sccache version must be defined}
        JUST_VERSION: ${JUST_VERSION:?just version must be defined}
        CARGO_BUMP_VERSION: ${CARGO_BUMP_VERSION:?cargo-bump version must be defined}
    environment:
      RUSTFMT_TOOLCHAIN: ${RUSTFMT_TOOLCHAIN:-}

# Workflow contract documentation (maintained with the implementation).
# Workflow contract: mdbook-utils / Build, test, optionally deploy to Pages & publish.
# Purpose: Build or exercise the container environment used by this repository; Deploy the checked
# site or application through the configured destination.
# Execution: workflow_dispatch. Trigger branches/paths below are the authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Manual controls: publish: If true, publish the code to crates.io; deploy_to_gh_pages: If true,
# deploy the user guide to GitHub Pages.
# Run policy: the concurrency block below controls cancellation/serialization; preserve production
# and manual side-effect guards.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

## Build, test the mdbook-utils code; build, test its user guide, and optionally publish to crates.io and deploy the user guide to Pages
##
## Workflow syntax: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Build, test, optionally deploy to Pages & publish

# run-name: ${{ github.ref_name }}, triggered by ${{ github.event_name }}; publish: ${{ inputs.publish }}, deploy to github: ${{ inputs.deploy_to_gh_pages }}

on:
  ## Runs on pushes targeting the default branch
  #push:
  #  branches: ["develop"]

  ## Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      publish:
        description: "If true, publish the code to crates.io"
        type: boolean
        required: true
        default: false
      deploy_to_gh_pages:
        description: "If true, deploy the user guide to GitHub Pages"
        type: boolean
        required: true
        default: false

## Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

## Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
## However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Each job will run inside its own virtual machine runner
  # Job build: Build or exercise the container environment used by this repository.
  # Container/toolchain validation covers packaging and native dependencies that a host-only
  # compiler check cannot prove.
  build:
    timeout-minutes: 60
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Basic information
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: echo "The job was automatically triggered by a ${EVENT_NAME} event from @${ACTOR}. The OS is ${RUNNER_OS}. The current dir is $(pwd)"
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0" # 0 indicates all history for all branches and tags. Allows the use of `git`. See https://github.com/actions/checkout
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Git status and tags
        run: |
          git --version
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git status
          # git tag
          # git describe --tags
      - name: Create output folder
        run: mkdir -p ./user_guide_book/
      - name: Build Docker image
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.ci.yaml build
      - name: Build / test the code and the user guide
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.ci.yaml run --rm mdbook-utils
        if: ${{ !inputs.publish }}
      - name: Build / test the code and the user guide AND PUBLISH to crates.io
        # Pass the crates.io secret as an env. variable, which is then used by `publish.sh`.
        # See <https://docs.docker.com/compose/environment-variables/envvars-precedence/>
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: docker compose -f .devcontainer/compose.yaml -f .devcontainer/compose.ci.yaml run --rm --env CRATES_TOKEN
          mdbook-utils .devcontainer/publish.sh -y
        if: ${{ inputs.publish }}
      - name: Setup Github Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Transfer this job output to the next consumer or retain diagnostics. Uploading an artifact
      # alone does not execute the deployment job.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./user_guide_book/

  ## GitHub Pages Deployment job
  # Job pages-deploy: Deploy the checked site or application through the configured destination.
  # This job can change a live environment; keep its condition, permissions and environment
  # protections together.
  # Dependency boundary: "build"; downstream work must not consume an unchecked or missing upstream
  # result.
  # Guard: ${{ inputs.deploy_to_gh_pages }}. Keep this condition when refactoring triggers or job
  # dependencies.
  pages-deploy:
    timeout-minutes: 30
    name: Deploy to GitHub Pages
    if: ${{ inputs.deploy_to_gh_pages }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.github_deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      # This is a publication boundary. Preserve its preceding validation, existing event/ref guard,
      # environment approvals and write permissions.
      - name: Deploy to GitHub Pages
        id: github_deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/mdbook-utils/main
  CARGO_INCREMENTAL: "0"

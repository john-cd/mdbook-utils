# TODO Reviewed ??-??-2026.
name: Deploy the user guide to Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-progress deployments.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Public location of the user guide; used for the sitemap.
  GUIDE_URL: https://john-cd.com/mdbook-utils/

jobs:
  build:
    name: Build the user guide and its sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@510b3ecd7915856b6909305605afa7a8a57c1b04 # v2.48.1
        with:
          tool: mdbook@0.5.4

      - name: Build and test the user guide
        run: |
          mdbook build ./user_guide
          mdbook test ./user_guide

      - name: Write sitemap.xml into the rendered guide
        env:
          MDBOOK_UTILS_BOOK_ROOT_DIR_PATH: user_guide
        run: cargo run --locked -- sitemap --base-url "$GUIDE_URL"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./user_guide/book/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

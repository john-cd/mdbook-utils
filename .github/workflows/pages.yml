# TODO Reviewed ??-??-2026.
name: Deploy the user guide to Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel in-progress deployments.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Public location of the user guide; used for the sitemap.
  GUIDE_URL: https://john-cd.com/mdbook-utils/

  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/mdbook-utils/main
  CARGO_INCREMENTAL: "0"
jobs:
  build:
    name: Build the user guide and its sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Install compiler cache
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: sccache@0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/mdbook-utils/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: . -> ${{ github.workspace }}/.ci/target/mdbook-utils/main

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: mdbook@0.5.4,sccache@0.19.0

      - name: Build and test the user guide
        run: |
          mdbook build ./user_guide
          mdbook test ./user_guide

      - name: Write sitemap.xml into the rendered guide
        env:
          MDBOOK_UTILS_BOOK_ROOT_DIR_PATH: user_guide
        run: cargo run --locked -- sitemap --base-url "$GUIDE_URL"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./user_guide/book/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

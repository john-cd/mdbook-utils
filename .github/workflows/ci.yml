# TODO Reviewed ??-??-2026.
name: Rust CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Install pinned nightly rustfmt
        shell: bash
        run: |
          RUSTFMT_TOOLCHAIN="${RUSTFMT_TOOLCHAIN:-$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rustfmt-toolchain.toml)}"
          echo "RUSTFMT_TOOLCHAIN=$RUSTFMT_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Check formatting
        shell: bash
        run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all -- --check

      - name: Install compiler cache
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: sccache@0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/mdbook-utils/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: . -> .ci/target/mdbook-utils/main

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: mdbook@0.5.4,sccache@0.19.0

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run doctests
        run: cargo test --doc --locked

      - name: Build API documentation
        run: cargo doc --no-deps --locked

      - name: Build and test mdBooks
        shell: bash
        run: |
          mdbook build ./user_guide
          mdbook test ./user_guide
          mdbook build ./test_book
          mdbook test ./test_book

  coverage:
    name: Coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - name: Install compiler cache
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: sccache@0.19.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/mdbook-utils/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: . -> .ci/target/mdbook-utils/main

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov,sccache@0.19.0

      - name: Report line coverage
        run: cargo llvm-cov --locked --summary-only
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/mdbook-utils/main
  CARGO_INCREMENTAL: "0"

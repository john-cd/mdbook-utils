# Workflow contract documentation (maintained with the implementation).
# Workflow contract: mdbook-utils / Rust CI.
# Purpose: Classify changed inputs and export decisions to downstream jobs; Compile, lint or test
# the Rust source for the scope selected by the commands below; Build or validate the maintained
# documentation and generated output; Measure executed-code coverage with instrumented binaries;
# Check the declared minimum Rust compiler, independently of the current development compiler; Build
# or exercise the container environment used by this repository.
# Execution: pull_request, push, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

# TODO Reviewed ??-??-2026.

name: Rust CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job changes: Classify changed inputs and export decisions to downstream jobs.
  # Skip only the scopes named by these filters; fixtures, manifests and workflow changes must still
  # select their owning validation.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!TODO.md'
              - '!AGENTS.md'
              - '!CONTRIBUTING.md'
              - '!CHANGELOG.md'
              - '!RELEASES.md'
              - '!.github/workflows/README.md'
              - '!user_guide/**/*.md'
            container:
              - '{.devcontainer/**,.dockerignore,.github/workflows/**}'
  # Job validate: Compile, lint or test the Rust source for the scope selected by the commands
  # below.
  # Keep compiler/profile/feature selections aligned so adjacent commands reuse outputs; retain real
  # binary generation, doctests and distinct minimum-version checks.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}.
  # Keep this condition when refactoring triggers or job dependencies.
  # Matrix entries are independent runners. Keep OS/toolchain/feature-specific tests; consolidate
  # only checks whose inputs are identical.
  validate:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}
    name: Validate (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Export trusted step outputs for later steps in this job. GITHUB_ENV requires assignments or
      # its explicit multiline syntax; comments in pin files are not assignments.
      - name: Load pinned stable Rust version
        id: load-stable-rust
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rust_version="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          if [[ -z "$rust_version" ]]; then
            echo "Could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.load-stable-rust.outputs.version }}
          components: clippy

      # Export trusted step outputs for later steps in this job. GITHUB_ENV requires assignments or
      # its explicit multiline syntax; comments in pin files are not assignments.
      - name: Install pinned nightly rustfmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          RUSTFMT_TOOLCHAIN="${RUSTFMT_TOOLCHAIN:-$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rustfmt-toolchain.toml)}"
          echo "RUSTFMT_TOOLCHAIN=$RUSTFMT_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all -- --check

      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install compiler cache
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: sccache@0.19.0
      # Reuse downloaded dependencies/compiler artifacts through this cache configuration. Cache
      # misses must remain correct; keys must distinguish incompatible toolchains, profiles and
      # dependency graphs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/mdbook-utils/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: . -> .ci/target/mdbook-utils/main

      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: mdbook@0.5.4

      # Clippy performs compiler checking for these targets/features as well as linting. Keep a
      # separate cargo check only when it covers a different compiler, target or feature set.
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      # Execute documentation examples separately: passing unit/integration tests or Nextest does
      # not establish doctest correctness.
      - name: Run doctests
        run: cargo test --doc --locked

      - name: Build API documentation
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --locked

      - name: Build and test mdBooks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mdbook build ./user_guide
          mdbook test ./user_guide
          mdbook build ./test_book
          mdbook test ./test_book

  # Job documentation: Build or validate the maintained documentation and generated output.
  # Rendering catches broken configuration, includes and generated links that a source formatter
  # cannot detect.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: needs.changes.outputs.code != 'true'. Keep this condition when refactoring triggers or
  # job dependencies.
  documentation:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2
      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: mdbook@0.5.4
      - name: Build and test mdBooks
        run: |
          mdbook build ./user_guide
          mdbook test ./user_guide
          mdbook build ./test_book
          mdbook test ./test_book

  # Job coverage: Measure executed-code coverage with instrumented binaries.
  # Instrumentation can change build outputs; this job is separate from ordinary validation so
  # coverage does not reuse incompatible binaries.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}.
  # Keep this condition when refactoring triggers or job dependencies.
  coverage:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}
    name: Coverage baseline
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Export trusted step outputs for later steps in this job. GITHUB_ENV requires assignments or
      # its explicit multiline syntax; comments in pin files are not assignments.
      - name: Load pinned stable Rust version
        id: load-stable-rust
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rust_version="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          if [[ -z "$rust_version" ]]; then
            echo "Could not read channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
          echo "version=$rust_version" >> "$GITHUB_OUTPUT"
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.load-stable-rust.outputs.version }}
          components: llvm-tools-preview

      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - name: Install compiler cache
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: sccache@0.19.0
      # Reuse downloaded dependencies/compiler artifacts through this cache configuration. Cache
      # misses must remain correct; keys must distinguish incompatible toolchains, profiles and
      # dependency graphs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: config-v1-${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-${{
            hashFiles('Cargo.toml', '**/.cargo/config.toml', '**/rust-toolchain.toml', '**/Cargo.lock') }}
          cache-directories: ${{ github.workspace }}/.ci/build/mdbook-utils/main
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch) }}
          workspaces: . -> .ci/target/mdbook-utils/main

      # Install the tool versions consumed by the following checks. Prefer the existing prebuilt
      # installer path to recompiling development tools on every fresh runner.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov,mdbook@0.5.4

      - name: Report line coverage
        run: cargo llvm-cov --locked --summary-only

  # Job msrv: Check the declared minimum Rust compiler, independently of the current development
  # compiler.
  # A passing current-toolchain build does not prove the advertised minimum version still compiles.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}.
  # Keep this condition when refactoring triggers or job dependencies.
  msrv:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: ""
      CARGO_BUILD_RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install the compiler/components required by this lane. Keep the stable, minimum-version and
      # formatter toolchains distinct where their contracts differ.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Check declared minimum version
        run: cargo check --all-targets --locked

  # Job container-build: Build or exercise the container environment used by this repository.
  # Container/toolchain validation covers packaging and native dependencies that a host-only
  # compiler check cannot prove.
  # Dependency boundary: "changes"; downstream work must not consume an unchecked or missing
  # upstream result.
  # Guard: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.container == 'true'
  # }}. Keep this condition when refactoring triggers or job dependencies.
  container-build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.container == 'true' }}
    name: Build the CI container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Export trusted step outputs for later steps in this job. GITHUB_ENV requires assignments or
      # its explicit multiline syntax; comments in pin files are not assignments.
      - name: Load pinned container build inputs
        # GITHUB_ENV accepts assignments, not the file's preserved review comments.
        run: |
          grep -E '^(RUST_IMAGE_LABEL|CARGO_BINSTALL_VERSION|CARGO_BINSTALL_SHA256|RUSTFMT_TOOLCHAIN|MDBOOK_VERSION|SCCACHE_VERSION|JUST_VERSION)=' \
            .devcontainer/container-build.env >> "$GITHUB_ENV"

      - name: Build the CI image
        run: |
          docker build --progress=plain \
            --file .devcontainer/Dockerfile \
            --target ci \
            --tag "mdbook-utils-ci:${GITHUB_SHA}" \
            --build-arg "RUST_IMAGE_LABEL=${RUST_IMAGE_LABEL}" \
            --build-arg "CARGO_BINSTALL_VERSION=${CARGO_BINSTALL_VERSION}" \
            --build-arg "CARGO_BINSTALL_SHA256=${CARGO_BINSTALL_SHA256}" \
            --build-arg "RUSTFMT_TOOLCHAIN=${RUSTFMT_TOOLCHAIN}" \
            --build-arg "MDBOOK_VERSION=${MDBOOK_VERSION}" \
            --build-arg "SCCACHE_VERSION=${SCCACHE_VERSION}" \
            --build-arg "JUST_VERSION=${JUST_VERSION}" \
            .
env:
  CODE_TARGET_ROOT: ${{ github.workspace }}/.ci/target
  CODE_BUILD_ROOT: ${{ github.workspace }}/.ci/build
  CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_TARGET_DIR: ${{ github.workspace }}/.ci/target/mdbook-utils/main
  CARGO_BUILD_BUILD_DIR: ${{ github.workspace }}/.ci/build/mdbook-utils/main
  CARGO_INCREMENTAL: "0"

# TODO Reviewed ??-??-2026
name: Rust CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Install pinned nightly rustfmt
        shell: bash
        run: |
          RUSTFMT_TOOLCHAIN="${RUSTFMT_TOOLCHAIN:-$(tr -d '\r\n' < rustfmt-toolchain)}"
          echo "RUSTFMT_TOOLCHAIN=$RUSTFMT_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTFMT_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Check formatting
        shell: bash
        run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --all -- --check

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - uses: taiki-e/install-action@510b3ecd7915856b6909305605afa7a8a57c1b04 # v2.48.1
        with:
          tool: mdbook@0.5.4

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run doctests
        run: cargo test --doc --locked

      - name: Build API documentation
        run: cargo doc --no-deps --locked

      - name: Build and test mdBooks
        shell: bash
        run: |
          mdbook build ./user_guide
          mdbook test ./user_guide
          mdbook build ./test_book
          mdbook test ./test_book

  coverage:
    name: Coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - uses: taiki-e/install-action@510b3ecd7915856b6909305605afa7a8a57c1b04 # v2.48.1
        with:
          tool: cargo-llvm-cov

      - name: Report line coverage
        run: cargo llvm-cov --locked --summary-only

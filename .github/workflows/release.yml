# TODO Reviewed ??-??-2026
## Build versioned binary archives when a `vX.Y.Z` tag is pushed and attach them,
## with SHA-256 checksums, to a GitHub release. The names match
## `[package.metadata.binstall]` in Cargo.toml so that `cargo binstall` works.
## Publishing to crates.io stays in publish.yml.
name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-13, target: x86_64-apple-darwin, ext: tar.gz }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          name="mdbook-utils-${{ matrix.target }}-v${version}"
          bin="mdbook-utils"
          [ "${{ runner.os }}" = "Windows" ] && bin="mdbook-utils.exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/$bin" LICENSE README.md dist/
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && 7z a "../$name.zip" . > /dev/null)
          else
            tar -C dist -czf "$name.tar.gz" .
          fi
          archive="$name.${{ matrix.ext }}"
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke test the packaged binary
        run: |
          mkdir smoke
          if [ "${{ matrix.ext }}" = "zip" ]; then 7z x -osmoke "${{ steps.package.outputs.archive }}" > /dev/null; else tar -C smoke -xzf "${{ steps.package.outputs.archive }}"; fi
          ./smoke/mdbook-utils* --help | head -n 5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  release:
    name: Attach archives to the GitHub release
    # Only for pushed tags: a manual run builds and tests the archives only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: artifacts/*

# TODO Reviewed ??-??-2026.
# Maintained dependency roots; immutable test fixtures are intentionally excluded.
version: 2
updates:
  - package-ecosystem: cargo
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    directory: /
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /.devcontainer
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: rust-toolchain
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directories:
      - /
      - /.devcontainer
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: devcontainers
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
      day: monday
      time: 06:00
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

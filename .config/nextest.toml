# Shared cargo-nextest repository configuration.
# This file is discovered automatically from the workspace root.

[profile.default]
fail-fast = true
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "fail"
final-status-level = "flaky"
failure-output = "final"
success-output = "never"

[profile.ci]
inherits = "default"
fail-fast = false
retries = 2
status-level = "skip"
final-status-level = "skip"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
report-name = "nextest-ci"

# Build configuration: see CONFIGURATION.md at the repository root.
# Run the repository build-setup recipe to link target/build to the central checkout slot.

[build]
# jobs = 1                      # number of parallel jobs, defaults to # of CPUs
# rustc = "rustc"               # the rust compiler tool
# rustc-wrapper = "…"           # run this wrapper instead of `rustc`
# rustc-workspace-wrapper = "…" # run this wrapper instead of `rustc` for workspace members
# rustdoc = "rustdoc"           # the doc generator tool
# target = "triple"             # build for the target triple (ignored by `cargo install`)
# target-dir = "target"         # path of where to place all generated artifacts
## Machine-specific settings (`target-dir`, `build-dir`, `rustc-wrapper`,
## `SCCACHE_DIR`) are NOT committed so the repository builds on any OS.
## Set them in your user-level `$CARGO_HOME/config.toml`, via `CARGO_*`
## environment variables, or use the `just` recipes. See AGENTS.md "Build outputs".

# The justfile/Makefile.toml reads CODE_*_ROOT overrides (with Windows and XDG defaults) and exports per-checkout Cargo output paths; use its cargo command for these roots.
rustc-wrapper = "sccache"
incremental = false
target-dir = "target"
build-dir = "build"

[env]
# rustflags = ["…", "…"]        # custom flags to pass to all compiler invocations
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
# rustdocflags = ["…", "…"]     # custom flags to pass to rustdoc
# incremental = true            # whether or not to enable incremental compilation
# dep-info-basedir = "…"        # path for the base directory for targets in depfiles

# [doc]
# browser = "chromium"          # browser to use with `cargo doc --open`,
#                               # overrides the `BROWSER` environment variable

# [env]
# # Set ENV_VAR_NAME=value for any process run by Cargo
# ENV_VAR_NAME = "value"
# # Set even if already present in environment
# ENV_VAR_NAME_2 = { value = "value", force = true }
# # Value is relative to .cargo directory containing `config.toml`, make absolute
# ENV_VAR_NAME_3 = { value = "relative/path", relative = true }

# [future-incompat-report]
# frequency = 'always' # when to display a notification about a future incompat report

# [cargo-new]
# vcs = "none"              # VCS to use ('git', 'hg', 'pijul', 'fossil', 'none')

# [http]
# debug = false               # HTTP debugging
# proxy = "host:port"         # HTTP proxy in libcurl format
# ssl-version = "tlsv1.3"     # TLS version to use
# ssl-version.max = "tlsv1.3" # maximum TLS version
# ssl-version.min = "tlsv1.1" # minimum TLS version
# timeout = 30                # timeout for each HTTP request, in seconds
# low-speed-limit = 10        # network timeout threshold (bytes/sec)
# cainfo = "cert.pem"         # path to Certificate Authority (CA) bundle
# check-revoke = true         # check for SSL certificate revocation
# multiplexing = true         # HTTP/2 multiplexing
# user-agent = "…"            # the user-agent header

# [install]
# root = "/some/path"         # `cargo install` destination directory

# [net]
# retry = 3                   # network retries
# git-fetch-with-cli = true   # use the `git` executable for git operations
# offline = true              # do not access the network

# [net.ssh]
# known-hosts = ["..."]       # known SSH host keys

# [patch.<registry>]
# # Same keys as for [patch] in Cargo.toml

## Cargo has 4 built-in profiles: dev, release, test, and bench.

# [profile.<name>]         # Modify profile settings via config.
# inherits = "dev"         # Inherits settings from [profile.dev].
# opt-level = 0            # Optimization level.
# debug = true             # Include debug info.
# split-debuginfo = '...'  # Debug info splitting behavior.
# debug-assertions = true  # Enables debug assertions.
# overflow-checks = true   # Enables runtime integer overflow checks.
# lto = false              # Sets link-time optimization.
# panic = 'unwind'         # The panic strategy.
# incremental = true       # Incremental compilation.
# codegen-units = 16       # Number of code generation units.
# rpath = false            # Sets the rpath linking option.
# strip = "none"           # Removes symbols or debuginfo.
# [profile.<name>.build-override]  # Overrides build-script settings.
# # Same keys for a normal profile.
# [profile.<name>.package.<name>]  # Override profile for a package.
# # Same keys for a normal profile (minus `panic`, `lto`, and `rpath`).

## Defaults for profile.dev
# [profile.dev]
# opt-level = 0
# debug = true
# split-debuginfo = '...'  # Platform-specific.
# strip = false
# debug-assertions = true
# overflow-checks = true
# lto = false
# panic = 'unwind'
# incremental = true
# codegen-units = 256 when incremental is enabled; otherwise 16
# rpath = false

# Example: enable a small amount of optimization in debug mode
# [profile.dev]
# opt-level = 1
# # Enable high optimizations for dependencies, but not for our code:
# [profile.dev.package."*"]
# opt-level = 3

## Default for release
# [profile.release]
# opt-level = 3
# debug = false
# split-debuginfo = '...'  # Platform-specific.
# strip = false
# debug-assertions = false
# overflow-checks = false
# lto = false
# panic = 'unwind'
# incremental = false
# codegen-units = 16
# rpath = false

## "ci" is used by the Github Action CD/CI workflow
SCCACHE_BASEDIRS = { value = ".", relative = true }

[env.SCCACHE_CACHE_SIZE]
value = "45G"
force = true

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"

[profile.dev]
lto = "off"
codegen-units = 256
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.debug]
debug = 2

[profile.debug.package."*"]
opt-level = 1
debug = 0

[profile.ci]
inherits = "dev"

[profile.dev.package]
hashbrown = { opt-level = 3 }
indexmap = { opt-level = 3 }
memchr = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
rayon = { opt-level = 3 }
rayon-core = { opt-level = 3 }
regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
smallvec = { opt-level = 3 }
syn = { opt-level = 3 }

[profile.debug.package]
hashbrown = { opt-level = 3, debug = 0 }
indexmap = { opt-level = 3, debug = 0 }
memchr = { opt-level = 3, debug = 0 }
proc-macro2 = { opt-level = 3, debug = 0 }
quote = { opt-level = 3, debug = 0 }
rayon = { opt-level = 3, debug = 0 }
rayon-core = { opt-level = 3, debug = 0 }
regex = { opt-level = 3, debug = 0 }
regex-automata = { opt-level = 3, debug = 0 }
regex-syntax = { opt-level = 3, debug = 0 }
smallvec = { opt-level = 3, debug = 0 }
syn = { opt-level = 3, debug = 0 }

[profile.tools]
inherits = "dev"
opt-level = 2


# Cargo defaults reference (Cargo 1.100.0). Comments only.
#
# [build]
# target = <host>
# target-dir = "target"
# build-dir = <unset; defaults to target-dir>
# rustc-wrapper = <unset>
# incremental = <profile default>
#
# [env]
# <variable> = <unset>
#
# [net]
# retry = 3
# git-fetch-with-cli = false
# offline = false
#
# [term]
# quiet = false
# verbose = false
# color = "auto"
# hyperlinks = true
# unicode = true
# progress.when = "auto"
# progress.width = 80
# progress.term-integration = true
#
# [alias]
# b = "build"
# c = "check"
# d = "doc"
# t = "test"
# r = "run"
# rm = "remove"
#
# [profile.dev]
# opt-level = 0
# debug = true
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = true
# overflow-checks = true
# lto = false
# panic = "unwind"
# incremental = true
# codegen-units = 256 when incremental is enabled; otherwise 16
# rpath = false
#
# [profile.dev.package."*"]
# opt-level = 0
#
# [profile.dev.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.debug]
# inherits = "dev"
#
# [profile.test]
# inherits = "dev"
#
# [profile.release]
# opt-level = 3
# debug = false
# split-debuginfo = <platform default>
# strip = "none"
# debug-assertions = false
# overflow-checks = false
# lto = false
# panic = "unwind"
# incremental = false
# codegen-units = 16
# rpath = false
#
# [profile.release.package."*"]
# opt-level = 3
#
# [profile.release.build-override]
# opt-level = 0
# debug = false when possible
# codegen-units = 256
#
# [profile.bench]
# inherits = "release"

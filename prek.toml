# TODO Reviewed ??-??-2026.
# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# :schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.6"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "end-of-file-fixer" },
  { id = "file-contents-sorter" },
  { id = "fix-byte-order-marker" },
  # { id = "check-json" },
  # { id = "check-json5" },
  # { id = "pretty-format-json" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  # { id = "no-commit-to-branch" },
  { id = "check-executables-have-shebangs" },
  # { id = "check-shebang-scripts-are-executable" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt --check", entry = "just fmt-check", language = "system", types = [
    "rust",
  ], pass_filenames = false },
  { id = "cargo-deny", name = "cargo deny --locked check", entry = "just deny", language = "system", pass_filenames = false, always_run = true },
]
